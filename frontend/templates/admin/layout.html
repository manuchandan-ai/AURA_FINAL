{% extends 'base.html' %}

{% block title %}Admin Dashboard — AURA{% endblock %}

{% block content %}
<section class="pt-5 mt-5 pb-5">
    <div class="container-fluid px-4 px-lg-5">
        <div class="row g-4">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2">
                <div class="aura-glass p-3 sticky-top" style="top: 100px; z-index: 10;">
                    <h5 class="text-white mb-4 ps-2"><i class="bi bi-shield-lock text-primary me-2"></i>Admin Center</h5>
                    <div class="nav flex-column nav-pills gap-2">
                        <a href="{{ url_for('admin.dashboard') }}" class="nav-link {% if request.endpoint == 'admin.dashboard' %}active bg-primary text-white{% else %}text-light{% endif %}">
                            <i class="bi bi-speedometer2 me-2"></i> Dashboard
                        </a>
                        <a href="{{ url_for('admin.users') }}" class="nav-link {% if request.endpoint == 'admin.users' %}active bg-primary text-white{% else %}text-light{% endif %}">
                            <i class="bi bi-people me-2"></i> Users
                        </a>
                        <a href="#" class="nav-link text-secondary" style="pointer-events: none;">
                            <i class="bi bi-gear me-2"></i> Settings <span class="badge bg-secondary ms-1" style="font-size: 0.6em;">WIP</span>
                        </a>
                    </div>
                </div>
            </div>
            
            <!-- Main Content -->
            <div class="col-md-9 col-lg-10">
                {% block admin_content %}{% endblock %}
            </div>
        </div>
    </div>
</section>
{% endblock %}
